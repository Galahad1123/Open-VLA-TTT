[project]
name = "vla-ttt-v100-training-env"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot-policy-vla-ttt",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
lerobot-policy-vla-ttt = { path = "../..", editable = true }
vla-ttt-eval-client = { path = "../../packages/eval-client", editable = true }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
