[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# LeRobot 0.6.1 discovers plugins from the literal distribution metadata name.
# Keep underscores here; PyPA still canonicalizes this to the same install name as
# ``lerobot-policy-vla-ttt``, while LeRobot can import it as a Python module.
name = "lerobot_policy_vla_ttt"
version = "0.1.0"
description = "Out-of-tree LeRobot policy plugin for VLA test-time training research"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
    "lerobot[evo1,training]==0.6.1",
    "vla-ttt-eval-client==0.1.0",
]

[tool.uv.sources]
vla-ttt-eval-client = { path = "packages/eval-client", editable = true }

[project.optional-dependencies]
libero = ["lerobot[libero]==0.6.1"]
rmbench = ["h5py==3.15.1"]

[project.scripts]
vla-ttt-train = "lerobot_policy_vla_ttt.cli:train"
vla-ttt-train-robomme = "lerobot_policy_vla_ttt.baselines.robomme_data:train"
vla-ttt-eval = "lerobot_policy_vla_ttt.cli:evaluate"
vla-ttt-rollout = "lerobot_policy_vla_ttt.cli:rollout"
vla-ttt-serve = "lerobot_policy_vla_ttt.evaluation.server:main"

[tool.ruff.lint.per-file-ignores]
"src/lerobot_policy_vla_ttt/evo1/*.py" = ["E501", "UP", "B", "I"]

[tool.ruff.format]
exclude = ["src/lerobot_policy_vla_ttt/evo1/*.py"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_policy_vla_ttt"]

[tool.hatch.build.targets.sdist]
# Never infer release contents from VCS state: research checkouts contain weights.
only-include = [
    "src", "tests", "docs", "configs", "scripts",
    "README.md", "LICENSE", "UPSTREAM.md", "pyproject.toml", "uv.lock",
    "packages/eval-client/src", "packages/eval-client/pyproject.toml",
    "environments/libero/pyproject.toml", "environments/libero/uv.lock",
    "environments/robomme/pyproject.toml", "environments/robomme/uv.lock",
    "environments/rmbench/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a real checkpoint and CUDA",
    "libero: requires the LIBERO benchmark environment and assets",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
